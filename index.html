<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portafolio de diseño</title>
  <meta name="description" content="Miniaturas, portadas de álbum, carteles y banners.">
  <meta name="theme-color" content="#1F2BD8">

  <!-- Vista previa al compartir el enlace (WhatsApp, email, redes).
       Pon en og:image la dirección COMPLETA de tu mejor imagen, por ejemplo:
       https://tuusuario.github.io/img/portada-noches-de-neon.jpg -->
  <meta property="og:title" content="Portafolio de diseño">
  <meta property="og:description" content="Miniaturas, portadas de álbum, carteles y banners.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="">

  <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.classList.replace("no-js", "js");</script>
</head>
<body>

  <!-- Pantalla de carga -->
  <div class="loader" id="loader" aria-hidden="true">
    <span class="loader__name" id="loader-name"></span>
    <span class="loader__count" id="loader-count">0</span>
  </div>

  <!-- Cursor personalizado (solo con ratón) -->
  <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__label" id="cursor-label"></span></div>

  <header class="nav" id="nav">
    <a class="nav__brand" href="#inicio"><strong id="nav-name"></strong><span id="nav-role"></span></a>
    <nav class="nav__links" aria-label="Secciones">
      <a href="#trabajos">Trabajos</a>
      <a href="#servicios">Servicios</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#contacto">Contacto</a>
    </nav>
    <span class="nav__status" id="nav-status"></span>
  </header>

  <main>
    <!-- Portada: lienzo infinito de trabajos -->
    <section class="hero" id="inicio" aria-label="Portada">
      <div class="hero__frame" id="hero-frame">
        <div class="canvas" id="canvas" aria-hidden="true"></div>
        <h1 class="hero__title" id="hero-title"></h1>
        <div class="hero__foot">
          <p class="hero__intro" id="hero-intro"></p>
          <p class="hero__hint" id="hero-hint">Arrastra para explorar</p>
        </div>
      </div>
    </section>

    <!-- Trabajos -->
    <section class="work" id="trabajos">
      <div class="work__head">
        <h2 class="work__title">Trabajos<sup id="work-count"></sup></h2>
        <div class="work__tools">
          <div class="filters" id="filters" role="tablist" aria-label="Filtrar por tipo"></div>
          <div class="views" role="group" aria-label="Vista">
            <button class="views__btn" type="button" data-view="list" aria-pressed="true">Lista</button>
            <button class="views__btn" type="button" data-view="grid" aria-pressed="false">Cuadrícula</button>
          </div>
        </div>
      </div>
      <ul class="list" id="list"></ul>
      <ul class="grid" id="grid" hidden></ul>
      <div class="preview" id="preview" aria-hidden="true"><img id="preview-img" alt=""></div>
    </section>

    <!-- Servicios -->
    <section class="services" id="servicios">
      <div class="services__pin" id="services-pin">
        <div class="services__head">
          <h2 class="services__title">Servicios</h2>
          <p class="services__lead">Cada encargo incluye propuesta de concepto, una ronda de cambios y los archivos listos para usar.</p>
        </div>
        <div class="services__track" id="services-track"></div>
      </div>
    </section>

    <!-- Sobre mí -->
    <section class="about" id="sobre-mi">
      <h2 class="about__title">Sobre mí</h2>
      <div class="about__body">
        <p class="about__text" id="about-text"></p>
        <ul class="about__tools" id="about-tools" aria-label="Herramientas"></ul>
      </div>
    </section>

    <!-- Contacto -->
    <section class="contact" id="contacto">
      <h2 class="contact__big" id="contact-big">Hablemos</h2>
      <div class="contact__row">
        <div class="contact__mail">
          <a class="contact__email" id="contact-email" href="#"></a>
          <button class="contact__copy" id="contact-copy" type="button">Copiar email</button>
        </div>
        <ul class="contact__links" id="contact-links"></ul>
      </div>
      <footer class="footer">
        <span id="footer-name"></span>
        <span id="footer-time"></span>
        <a href="#inicio" class="footer__top">Volver arriba</a>
      </footer>
    </section>
  </main>

  <!-- Visor a pantalla completa -->
  <dialog class="viewer" id="viewer" aria-label="Trabajo">
    <div class="viewer__stage" id="viewer-stage" tabindex="-1" autofocus>
      <img class="viewer__img" id="viewer-img" alt="">
    </div>
    <aside class="viewer__side">
      <div class="viewer__text">
        <p class="viewer__cat" id="viewer-cat"></p>
        <h3 class="viewer__title" id="viewer-title"></h3>
        <p class="viewer__meta" id="viewer-meta"></p>
        <p class="viewer__desc" id="viewer-desc"></p>
        <div class="viewer__thumbs" id="viewer-thumbs"></div>
      </div>
      <div class="viewer__nav">
        <button class="viewer__btn" id="viewer-prev" type="button" aria-label="Trabajo anterior">←</button>
        <span class="viewer__count" id="viewer-count"></span>
        <button class="viewer__btn" id="viewer-next" type="button" aria-label="Trabajo siguiente">→</button>
      </div>
    </aside>
    <button class="viewer__close" id="viewer-close" type="button" aria-label="Cerrar">Cerrar</button>
  </dialog>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="works.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
